<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plantilla de componentes de Bootstrap" />
    <meta name="author" content="Ponce Victoria" />
    <link rel="stylesheet" href="./css/style.css" />

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Contactos</title>
  </head>

  <body>
    <header>
      <nav class="navbar bg-primary navbar-dark navbar-expand-lg">
        <div class="container">
          <a href="./index.html" class="navbar-brand">Plantilla de Bootstrap</a>
          <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#opcionesMenu"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
        <div class="collapse navbar-collapse" id="opcionesMenu">
          <ul class="navbar-nav ms-auto text-end p-2">
            <li class="nav-item">
              <a class="nav-link" href="../index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./grilla.html">Grilla</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./contactos.html">Contactos</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
   <main class="container my-4">
    <h1 class="mb-3">Formulario con Stacks</h1>
  <section class="border rounded p-3">
    <form>
      <div class="row mb-2">
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombre y Apellido</label>
          <input type="text" class="form-control form-control-sm" id="nombre" placeholder="Ej:Francisco Pérez">
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control form-control-sm" id="email" placeholder="Francisco19963@gmail.com">
        </div>
      </div>
      <div class="mb-2">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control form-control-sm" id="mensaje" rows="3" placeholder="Aquí agregá tu consulta"></textarea>
      </div>
      <div class="form-check form-switch mb-2">
        <input class="form-check-input" type="checkbox" id="aceptarTerminos">
        <label class="form-check-label" for="aceptarTerminos">Aceptar términos</label>
      </div>
      <button type="submit" class="btn btn-primary btn-sm">Enviar</button>
    </form>
  </section>
</main>


    <footer class="text-center bg-dark-subtle py-3">
      <p>&copy; Todos los derechos reservados 2026</p>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

      crossorigin="anonymous"
    ></script>
  </body>
</html>
